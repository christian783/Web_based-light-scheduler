<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphical Light Scheduler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1a3c5e;
        }
        .input-group {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="text"] {
            padding: 5px;
            width: 100px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Graphical Light Scheduler</h1>
        <div class="input-group">
            <label>On Time:</label>
            <input type="text" id="onTime" placeholder="HH:MM">
        </div>
        <div class="input-group">
            <label>Off Time:</label>
            <input type="text" id="offTime" placeholder="HH:MM">
        </div>
        <button onclick="submitSchedule()">Submit</button>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:8765');

        ws.onopen = () => {
            console.log('Connected to WebSocket server');
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        function submitSchedule() {
            const onTime = document.getElementById('onTime').value;
            const offTime = document.getElementById('offTime').value;

            // Validate time format (HH:MM)
            const timeRegex = /^([0-1]?[0-9]|2[0-3]):([0-5][0-9])$/;
            if (!timeRegex.test(onTime) || !timeRegex.test(offTime)) {
                alert('Please enter valid times in HH:MM format (e.g., 14:30)');
                return;
            }

            const schedule = { onTime, offTime };
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(schedule));
                console.log('Schedule sent:', schedule);
            } else {
                alert('WebSocket connection not open');
            }
        }
    </script>
</body>
</html>
